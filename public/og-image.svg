<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#04091a"/>
      <stop offset="50%" style="stop-color:#0d1f5c"/>
      <stop offset="100%" style="stop-color:#1648D8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#1648D8;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#04091a;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="white" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Logo text -->
  <text x="600" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">arista</text>
  <!-- Tagline -->
  <text x="600" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="white" opacity="0.7" text-anchor="middle" letter-spacing="1">Fibra, Móvil y Energía en Alicante</text>
  <!-- Service pills -->
  <rect x="310" y="380" width="140" height="44" rx="22" fill="#FFB800" opacity="0.9"/>
  <text x="380" y="408" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="black" text-anchor="middle">⚡ Luz</text>
  <rect x="480" y="380" width="160" height="44" rx="22" fill="#00B96B" opacity="0.9"/>
  <text x="560" y="408" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">📡 Fibra</text>
  <rect x="670" y="380" width="160" height="44" rx="22" fill="#E91E8C" opacity="0.9"/>
  <text x="750" y="408" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">📱 Móvil</text>
  <!-- URL -->
  <text x="600" y="510" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="white" opacity="0.4" text-anchor="middle">aristagroup.es</text>
  <!-- Accent line -->
  <rect x="540" y="540" width="120" height="3" rx="2" fill="#00E58A" opacity="0.6"/>
</svg>
